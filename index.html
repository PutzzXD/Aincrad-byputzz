<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUTZZ DB · Firebase</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #070a12;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(0,230,176,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(0,230,176,0.04) 0%, transparent 60%),
                linear-gradient(rgba(0,230,176,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,230,176,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }
        .card {
            max-width: 460px;
            width: 100%;
            background: rgba(12,18,34,0.92);
            backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 38px 32px;
            border: 1px solid rgba(0,230,176,0.06);
            box-shadow: 0 40px 80px rgba(0,0,0,0.7), 0 0 60px rgba(0,230,176,0.02);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(0,230,176,0.02) 0%, transparent 60%);
            animation: rotateBg 30s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateBg { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }

        .header { text-align: center; position: relative; z-index: 2; margin-bottom: 28px; }
        .header .icon { font-size: 42px; display: block; margin-bottom: 4px; }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e6b0, #008b6e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 40px rgba(0,230,176,0.08);
        }
        .header p { color: #5a6a80; font-size: 13px; font-weight: 400; letter-spacing: 0.5px; }
        .header p span { color: #00e6b0; font-weight: 600; }
        .badge {
            display: inline-block;
            background: rgba(0,230,176,0.04);
            border: 1px solid rgba(0,230,176,0.04);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 9px;
            color: #4a6a5a;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .glow-line { position: relative; z-index: 2; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,230,176,0.06), transparent); margin: 0 -8px 18px; }

        .form-group { position: relative; z-index: 2; margin-bottom: 18px; }
        .form-group label {
            color: #8899b0;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(0,230,176,0.06);
            background: rgba(8,12,22,0.7);
            color: #eef4ff;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(4px);
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #00e6b0;
            box-shadow: 0 0 0 4px rgba(0,230,176,0.04), 0 0 30px rgba(0,230,176,0.02);
            background: rgba(10,16,28,0.8);
        }
        .form-group input::placeholder { color: #3a4a5a; font-weight: 400; }
        .form-group select option { background: #0a0e1a; color: #eef4ff; }

        /* Toggle */
        .toggle-group {
            display: flex;
            gap: 6px;
            background: rgba(8,12,22,0.6);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid rgba(0,230,176,0.04);
            margin-bottom: 14px;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: #5a6a80;
            font-weight: 700;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }
        .toggle-btn.active {
            background: rgba(0,230,176,0.08);
            color: #00e6b0;
            border: 1px solid rgba(0,230,176,0.04);
        }
        .toggle-btn:active { transform: scale(0.94); }

        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        .btn {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #00e6b0, #00b894);
            color: #070a12;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(0,230,176,0.08);
            font-family: 'Orbitron', sans-serif;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(0,230,176,0.2); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .status {
            position: relative;
            z-index: 2;
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: none;
            backdrop-filter: blur(8px);
        }
        .status.success { display: block; background: rgba(0,230,176,0.06); color: #4ade80; border: 1px solid rgba(0,230,176,0.08); }
        .status.error { display: block; background: rgba(255,80,80,0.06); color: #f87171; border: 1px solid rgba(255,80,80,0.08); }
        .status.loading { display: block; background: rgba(255,215,0,0.04); color: #facc15; border: 1px solid rgba(255,215,0,0.06); }

        .footer { position: relative; z-index: 2; text-align: center; font-size: 10px; color: #2a3a4a; margin-top: 22px; letter-spacing: 0.5px; }
        .footer span { color: #00e6b0; font-weight: 700; }
        .footer .dev { color: #3a4a5a; }

        @media(max-width:500px){ .card { padding: 28px 18px; } .header h1 { font-size: 22px; } .row { flex-direction: column; } }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span class="icon">⚡</span>
        <h1>PUTZZ DB</h1>
        <p>Tambahkan nomor ke <span>Firebase</span> · <span class="badge">Realtime</span></p>
    </div>

    <div class="glow-line"></div>

    <form id="formAdd">
        <div class="form-group">
            <label>📱 Nomor WhatsApp</label>
            <input type="tel" id="nomor" placeholder="6281234567890" required>
        </div>
        <div class="form-group">
            <label>👤 Nama</label>
            <input type="text" id="nama" placeholder="Nama pengguna" required>
        </div>
        <div class="form-group">
            <label>⭐ Role</label>
            <select id="role">
                <option value="user">User</option>
                <option value="premium">Premium</option>
                <option value="admin">Admin</option>
                <option value="owner">Owner</option>
            </select>
        </div>

        <!-- TOGGLE UNIT -->
        <div class="toggle-group" id="toggleGroup">
            <button type="button" class="toggle-btn active" data-unit="days">📅 Hari</button>
            <button type="button" class="toggle-btn" data-unit="hours">⏰ Jam</button>
            <button type="button" class="toggle-btn" data-unit="minutes">⏱️ Menit</button>
        </div>

        <div class="form-group">
            <label id="unitLabel">📅 Jumlah Hari</label>
            <input type="number" id="unitValue" placeholder="30" value="30" min="1" required>
        </div>
        <div class="form-group">
            <label>📅 Tanggal Daftar</label>
            <input type="date" id="tanggal" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">➕ Tambahkan</button>
    </form>

    <div class="status" id="status"></div>
    <div class="footer">
        <span>PUTZZDEV</span> <span class="dev">· Firebase DB Writer</span>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCARA9X8ZJdtQaD_3eSCRGJDn1BzdBp_DY",
        authDomain: "nilai-2aa04.firebaseapp.com",
        databaseURL: "https://nilai-2aa04-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "nilai-2aa04",
        storageBucket: "nilai-2aa04.firebasestorage.app",
        messagingSenderId: "545147756419",
        appId: "1:545147756419:web:6ad402531002e367e8a0b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const form = document.getElementById('formAdd');
    const nomorInput = document.getElementById('nomor');
    const namaInput = document.getElementById('nama');
    const roleSelect = document.getElementById('role');
    const unitValue = document.getElementById('unitValue');
    const unitLabel = document.getElementById('unitLabel');
    const tanggalInput = document.getElementById('tanggal');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtns = document.querySelectorAll('.toggle-btn');

    let selectedUnit = 'days';

    // Toggle logic
    toggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            toggleBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedUnit = btn.dataset.unit;
            const labels = {
                days: '📅 Jumlah Hari',
                hours: '⏰ Jumlah Jam',
                minutes: '⏱️ Jumlah Menit'
            };
            unitLabel.textContent = labels[selectedUnit];
        });
    });

    tanggalInput.value = new Date().toISOString().split('T')[0];

    function setStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = 'status ' + type;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nomor = nomorInput.value.trim().replace(/[^0-9]/g, '');
        const nama = namaInput.value.trim();
        const role = roleSelect.value;
        const value = parseInt(unitValue.value.trim()) || 1;
        const tanggal = tanggalInput.value;

        if (!nomor || nomor.length < 10) {
            setStatus('⚠️ Nomor tidak valid! Minimal 10 digit.', 'error');
            return;
        }
        if (!nama) {
            setStatus('⚠️ Nama harus diisi!', 'error');
            return;
        }
        if (!tanggal) {
            setStatus('⚠️ Tanggal harus diisi!', 'error');
            return;
        }

        submitBtn.disabled = true;
        setStatus('⏳ Menyimpan ke Firebase...', 'loading');

        try {
            const data = {
                nama: nama,
                role: role,
                tanggal: tanggal,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            };

            // Simpan sesuai unit
            if (selectedUnit === 'days') {
                data.expired_days = value;
            } else if (selectedUnit === 'hours') {
                data.expired_hours = value;
            } else if (selectedUnit === 'minutes') {
                data.expired_minutes = value;
            }

            await db.ref('users/' + nomor).set(data);

            const unitText = {
                days: `${value} hari`,
                hours: `${value} jam`,
                minutes: `${value} menit`
            };
            setStatus(`✅ Berhasil! ${nama} (${nomor}) · ${unitText[selectedUnit]}`, 'success');
            form.reset();
            tanggalInput.value = new Date().toISOString().split('T')[0];
        } catch (err) {
            console.error(err);
            setStatus('❌ Gagal: ' + err.message, 'error');
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
